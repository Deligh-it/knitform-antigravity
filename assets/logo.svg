<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background circle subtle ambient glow -->
    <radialGradient id="knitAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#4E54C8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Yarn Ball Gradient -->
    <linearGradient id="yarnGrad" x1="20%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="45%" stop-color="#FF5858"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Needle Gradient 1 -->
    <linearGradient id="needleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEADE"/>
      <stop offset="40%" stop-color="#FFDDD2"/>
      <stop offset="100%" stop-color="#E29578"/>
    </linearGradient>

    <!-- Needle Gradient 2 -->
    <linearGradient id="needleGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEADE"/>
      <stop offset="40%" stop-color="#FFDDD2"/>
      <stop offset="100%" stop-color="#E29578"/>
    </linearGradient>

    <!-- Yarn Strand Glow / Line Highlight -->
    <linearGradient id="strandLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE3E3" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#240046" flood-opacity="0.35"/>
    </filter>
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Safe Margin Area: ~10% padding (active artwork within 48 to 464) -->

  <!-- Ambient Backdrop -->
  <circle cx="256" cy="256" r="200" fill="url(#knitAmbient)" />

  <!-- Knitting Needle 1 (Left-top to Right-bottom) -->
  <g filter="url(#needleShadow)">
    <!-- Needle body -->
    <line x1="72" y1="72" x2="432" y2="432" stroke="url(#needleGrad1)" stroke-width="12" stroke-linecap="round"/>
    <!-- Needle tip -->
    <polygon points="432,432 444,444 430,446" fill="#FCEADE"/>
    <!-- Needle End Knob -->
    <circle cx="72" cy="72" r="16" fill="#7B2CBF"/>
    <circle cx="70" cy="70" r="14" fill="#9D4EDD"/>
    <circle cx="66" cy="66" r="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Knitting Needle 2 (Right-top to Left-bottom) -->
  <g filter="url(#needleShadow)">
    <!-- Needle body -->
    <line x1="440" y1="72" x2="80" y2="432" stroke="url(#needleGrad2)" stroke-width="12" stroke-linecap="round"/>
    <!-- Needle tip -->
    <polygon points="80,432 68,444 82,446" fill="#FCEADE"/>
    <!-- Needle End Knob -->
    <circle cx="440" cy="72" r="16" fill="#7B2CBF"/>
    <circle cx="438" cy="70" r="14" fill="#9D4EDD"/>
    <circle cx="434" cy="66" r="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Yarn Ball Core -->
  <g filter="url(#softShadow)">
    <!-- Base Spherical Silhouette -->
    <circle cx="256" cy="256" r="132" fill="url(#yarnGrad)"/>

    <!-- Woven Yarn Strands (Curved Textures) -->
    <!-- Layer 1: Deep shadow curves -->
    <path d="M 148,220 C 180,160 332,160 364,220" fill="none" stroke="#5A189A" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
    <path d="M 140,260 C 180,190 332,190 372,260" fill="none" stroke="#5A189A" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
    <path d="M 152,300 C 190,240 322,240 360,300" fill="none" stroke="#5A189A" stroke-width="9" stroke-linecap="round" opacity="0.45"/>

    <!-- Layer 2: Main Body Loops & Overlaps -->
    <path d="M 136,236 C 160,140 352,140 376,236 C 392,300 340,380 256,388 C 172,380 120,300 136,236 Z" 
          fill="none" stroke="url(#yarnGrad)" stroke-width="14" stroke-linejoin="round" opacity="0.7"/>

    <path d="M 156,204 C 200,280 312,280 356,204" fill="none" stroke="url(#strandLight)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 136,256 C 188,348 324,348 376,256" fill="none" stroke="url(#strandLight)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 180,144 C 276,176 336,280 348,348" fill="none" stroke="url(#strandLight)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 332,144 C 236,176 176,280 164,348" fill="none" stroke="#FFE3E3" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

    <!-- Layer 3: Central Signature 'K' Stitch Feature -->
    <path d="M 232,208 L 232,304" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M 280,216 L 236,256 L 284,300" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Yarn Tail (Flowing Thread reaching outwards) -->
    <path d="M 344,332 C 376,376 400,388 436,380 C 460,374 472,392 468,412" 
          fill="none" stroke="#FF758C" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
